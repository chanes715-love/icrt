<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICRT 每日英語廣播 - 和風播放器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Noto Serif TC 與 Shippori Mincho 營造濃厚日式書卷感 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --washi-bg: #FFFFFF;       /* 純白底色 */
            --sumi-ink: #2B2B2B;       /* 墨色 */
            --ai-indigo: #1E3A5F;      /* 藍染 / 靛藍 */
            --shu-red: #C53D43;        /* 朱色 / 茜色 */
            --matcha-green: #5B6E58;   /* 抹茶 / 松葉色 */
            --gold-wood: #C8B69E;      /* 白木 / 金茶邊框 */
        }

        body {
            font-family: 'Shippori Mincho', 'Noto Serif TC', serif;
            background-color: #FFFFFF;
            color: var(--sumi-ink);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 純白背景搭配極淡雅灰色和風邊框 */
        .washi-container {
            background-color: #FFFFFF;
            background-image: none;
            box-shadow: 0 4px 20px -2px rgba(43, 43, 43, 0.06);
        }

        /* 日式雙層細框 (Kaku-waku) */
        .japanese-frame {
            border: 1.5px solid var(--gold-wood);
            position: relative;
        }
        .japanese-frame::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid rgba(200, 182, 158, 0.45);
            pointer-events: none;
            border-radius: 0.375rem;
        }

        /* 朱印 (Hanko) 印章風格 */
        .hanko-stamp {
            border: 1.5px solid var(--shu-red);
            color: var(--shu-red);
            font-weight: 700;
            letter-spacing: 0.05em;
            box-shadow: inset 0 0 0 1px rgba(197, 61, 67, 0.15);
            transform: rotate(-3deg);
        }

        /* 客製化原生 Audio 播放器外框 */
        audio {
            width: 100%;
            height: 36px;
            border-radius: 6px;
            outline: none;
            background-color: #FFFFFF;
        }
        audio::-webkit-media-controls-panel {
            background-color: #FFFFFF;
        }

        /* 進度條動畫與按鈕轉場 */
        .btn-wafuu {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-wafuu:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 58, 95, 0.18);
        }
        .btn-wafuu:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="m-0 p-0 bg-white overflow-hidden flex items-center justify-center w-[360px] h-[200px]">

    <!-- 主外框：精準對應 360x200 像素尺寸，適合直接透過 iframe 嵌入 -->
    <div class="washi-container japanese-frame rounded-lg w-[350px] h-[200px] px-3.5 py-2.5 relative overflow-hidden bg-white flex flex-col justify-between box-border">
        
        <!-- 角落裝飾：傳統梅花/櫻花家紋浮水印 -->
        <svg class="w-20 h-20 text-gray-100 opacity-60 absolute -right-4 -top-4 pointer-events-none" 
            viewBox="0 0 100 100" fill="currentColor">
            <path d="M50 15 C55 30 70 30 70 15 C85 20 80 35 65 40 C80 45 85 60 70 65 C70 50 55 50 50 65 C45 50 30 50 30 65 C15 60 20 45 35 40 C20 35 15 20 30 15 C30 30 45 30 50 15 Z" />
            <circle cx="50" cy="40" r="6" fill="#FFFFFF"/>
        </svg>

        <!-- 頂部標題與右上角指定日期欄 -->
        <div class="flex items-center justify-between gap-1 pb-1.5 border-b border-[#E5DEC9] relative z-10">
            <div class="flex items-center gap-1.5 shrink-0">
                <!-- 朱印徽章 -->
                <div class="hanko-stamp px-1.5 py-0.5 text-[10px] rounded select-none bg-white leading-tight">
                    英語廣播
                </div>
                <h1 class="text-xs font-bold tracking-wider text-[#2B2B2B]">
                    ICRT 新聞
                </h1>
            </div>

            <!-- 右上角：指定日期選擇器 + 星期顯示 + 回今日 -->
            <div class="flex items-center gap-1 bg-white border border-[#D5CBB8] px-1.5 py-0.5 rounded text-[11px] text-[#4A443B]">
                <input 
                    type="date" 
                    id="manual-date-picker" 
                    title="指定音檔日期"
                    class="bg-white text-[11px] text-[#2B2B2B] font-medium focus:outline-none cursor-pointer w-[98px]"
                />
                <span id="japanese-date-badge" class="tracking-tight font-medium text-[#C53D43] text-[10px] shrink-0">(載入中)</span>
                <button 
                    id="reset-today-btn" 
                    type="button"
                    title="回到今日"
                    class="hidden text-[#1E3A5F] underline hover:text-[#C53D43] text-[10px] shrink-0 ml-0.5"
                >
                    今
                </button>
            </div>
        </div>

        <!-- 核心內容區（保留原本 ID 以向下相容，並由 JS 渲染和風介面） -->
        <div class="player-content relative z-10 my-auto" id="player-content-v1-6-0">
            <!-- 內容將由下面的腳本動態生成 -->
        </div>
    </div>

    <script>
        /*
         * ICRT 每日英語廣播 - 日式和風版 v1.8.0 (360x200 精簡版)
         * 邏輯: 週一至週五抓取「當日」音檔 URL + 連結到 "已發佈" 的 Google Doc
         */
        (function() {
            // --- 1. [!!重要設定!!] ---
            // 貼上 "已發佈" 的 Google Doc 連結 (結尾是 /pub)
            const PUBLISHED_DOC_URL = 'https://docs.google.com/document/d/e/2PACX-1vQZgANuYk8nK9TrrUFAj50LzbwE6MohMwJucp2n3nDn4X-s8jD9QvAD2n5rmOeJI0SidB01AMCWA-Wn/pub';
            // ---------------------------

            const contentDiv = document.getElementById('player-content-v1-6-0');
            const dateBadge = document.getElementById('japanese-date-badge');
            const datePicker = document.getElementById('manual-date-picker');
            const resetBtn = document.getElementById('reset-today-btn');

            if (!contentDiv) return;

            // 中文星期對照表
            const CHINESE_DAYS = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];

            // 輔助函式: 格式化日期為 "YYYYMMDD" 供音檔連結使用
            const formatDateYYYYMMDD = (dateObj) => {
                const year = dateObj.getFullYear();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getDate()).padStart(2, '0');
                return `${year}${month}${day}`;
            };

            // 輔助函式: 格式化為 input[type="date"] 所需的 "YYYY-MM-DD"
            const formatDateInput = (dateObj) => {
                const year = dateObj.getFullYear();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            // 輔助函式: 格式化為中文星期顯示 "(週五)" 搭配右上角日期選擇器
            const formatChineseDayBadge = (dateObj) => {
                const chineseDay = CHINESE_DAYS[dateObj.getDay()];
                return `(${chineseDay})`;
            };

            // 計算預設目標音檔日期與狀態（週一至週五直接抓取當天音檔）
            const getAutoTargetStatus = (baseDate) => {
                const dayOfWeek = baseDate.getDay(); // 0 = 週日, 6 = 週六
                let targetDate = new Date(baseDate);
                let showPlayer = true;
                let message = '';
                let subMessage = '';

                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    showPlayer = false;
                    message = '今日無音檔 (Weekend)';
                    subMessage = '週末無新廣播，可聽取週五音檔或閱覽文字檔。';
                }

                return { targetDate, showPlayer, message, subMessage };
            };

            // 取得最近一個週五的日期（供週末一鍵試聽使用）
            const getLastFriday = (fromDate) => {
                const d = new Date(fromDate);
                const day = d.getDay();
                const diff = (day === 0) ? 2 : (day === 6 ? 1 : 0);
                d.setDate(d.getDate() - diff);
                return d;
            };

            // 渲染播放器或週末休講訊息
            const renderPlayer = (options) => {
                const { targetDate, showPlayer, message, subMessage } = options;
                contentDiv.innerHTML = '';

                const activeDate = showPlayer ? targetDate : new Date();

                // 更新右上角中文星期標籤
                if (dateBadge) {
                    dateBadge.textContent = formatChineseDayBadge(activeDate);
                }

                // 同步右上角日期選擇器數值
                if (datePicker) {
                    datePicker.value = formatDateInput(activeDate);
                }

                if (showPlayer) {
                    const dateString = formatDateYYYYMMDD(targetDate);
                    const guessedAudioUrl = `https://www.icrt.com.tw/en/ext/rss/LunchBox/${dateString}NK.mp3`;

                    // 外層和風容器 (緊湊間距以符合 200px 高度)
                    const wrapper = document.createElement('div');
                    wrapper.className = 'space-y-2';

                    // 音訊播放器區塊
                    const audioBox = document.createElement('div');
                    audioBox.className = 'bg-white border border-[#E2D9C8] rounded px-2.5 py-1.5';

                    const audioHeader = document.createElement('div');
                    audioHeader.className = 'flex items-center justify-between text-[11px] text-[#5C5549] mb-1';
                    audioHeader.innerHTML = `
                        <span class="flex items-center gap-1 font-medium">
                            <svg class="w-3.5 h-3.5 text-[#1E3A5F]" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z"/>
                            </svg>
                            音檔：${dateString}NK.mp3
                        </span>
                        <a href="${guessedAudioUrl}" target="_blank" rel="noopener noreferrer" class="text-[#1E3A5F] hover:text-[#C53D43] underline transition-colors">
                            開啟音檔 ↗
                        </a>
                    `;

                    // 建立 <audio> 播放器
                    const audioPlayer = document.createElement('audio');
                    audioPlayer.controls = true;
                    audioPlayer.preload = 'none';

                    const source = document.createElement('source');
                    source.src = guessedAudioUrl;
                    source.type = 'audio/mpeg';

                    audioPlayer.appendChild(source);
                    audioPlayer.appendChild(document.createTextNode('您的瀏覽器不支援音訊播放。'));

                    audioBox.appendChild(audioHeader);
                    audioBox.appendChild(audioPlayer);

                    // 建立 <a> 連結 (日式藍染織布按鈕樣式)
                    const link = document.createElement('a');
                    link.href = PUBLISHED_DOC_URL;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.className = 'transcript-link btn-wafuu flex items-center justify-center gap-1.5 w-full py-1.5 px-3 rounded bg-[#1E3A5F] hover:bg-[#162C49] text-[#FFFFFF] font-semibold text-xs tracking-wider shadow-sm border border-[#12233A]';
                    link.innerHTML = `
                        <svg class="w-3.5 h-3.5 text-[#DFC89E]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                        <span>—— ICRT 每日文字檔 ——</span>
                    `;

                    wrapper.appendChild(audioBox);
                    wrapper.appendChild(link);
                    contentDiv.appendChild(wrapper);

                } else {
                    // 顯示週末休講訊息
                    const weekendBox = document.createElement('div');
                    weekendBox.className = 'bg-white border border-[#E2D9C8] rounded p-2 text-center space-y-1.5';

                    const status = document.createElement('p');
                    status.className = 'status-message text-xs font-bold text-[#C53D43] tracking-wider flex items-center justify-center gap-1';
                    status.innerHTML = `<span>🍵</span> <span>${message}</span>`;

                    const sub = document.createElement('p');
                    sub.className = 'text-[11px] text-[#5C5549]';
                    sub.textContent = subMessage;

                    const actionRow = document.createElement('div');
                    actionRow.className = 'flex items-center justify-center gap-2 pt-0.5';

                    // 週末一鍵播放上週五音檔
                    const playFridayBtn = document.createElement('button');
                    playFridayBtn.type = 'button';
                    playFridayBtn.className = 'btn-wafuu px-2.5 py-1 rounded bg-[#5B6E58] hover:bg-[#4A5A47] text-[#FFFFFF] text-[11px] font-semibold';
                    playFridayBtn.textContent = '▶ 聽週五音檔';
                    playFridayBtn.addEventListener('click', () => {
                        const lastFri = getLastFriday(new Date());
                        resetBtn.classList.remove('hidden');
                        renderPlayer({
                            targetDate: lastFri,
                            showPlayer: true,
                            isManual: true
                        });
                    });

                    // 週末查看每日文字檔
                    const docLink = document.createElement('a');
                    docLink.href = PUBLISHED_DOC_URL;
                    docLink.target = '_blank';
                    docLink.rel = 'noopener noreferrer';
                    docLink.className = 'transcript-link btn-wafuu px-2.5 py-1 rounded bg-[#1E3A5F] hover:bg-[#162C49] text-[#FFFFFF] text-[11px] font-semibold';
                    docLink.textContent = '📖 每日文字檔';

                    actionRow.appendChild(playFridayBtn);
                    actionRow.appendChild(docLink);

                    weekendBox.appendChild(status);
                    weekendBox.appendChild(sub);
                    weekendBox.appendChild(actionRow);
                    contentDiv.appendChild(weekendBox);
                }
            };

            // 初始載入
            const initDefault = () => {
                const today = new Date();
                const autoStatus = getAutoTargetStatus(today);
                resetBtn.classList.add('hidden');
                renderPlayer({
                    ...autoStatus,
                    isManual: false
                });
            };

            // 綁定手動選擇日期事件
            if (datePicker) {
                datePicker.addEventListener('change', (e) => {
                    if (!e.target.value) return;
                    const parts = e.target.value.split('-');
                    const chosenDate = new Date(
                        parseInt(parts[0], 10),
                        parseInt(parts[1], 10) - 1,
                        parseInt(parts[2], 10)
                    );
                    resetBtn.classList.remove('hidden');
                    renderPlayer({
                        targetDate: chosenDate,
                        showPlayer: true,
                        isManual: true
                    });
                });
            }

            // 綁定回到今日推算按鈕
            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    initDefault();
                });
            }

            // 啟動執行
            initDefault();
        })();
    </script>
</body>
</html>
